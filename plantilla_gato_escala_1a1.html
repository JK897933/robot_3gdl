<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Plantilla de Calibración 1:1 - Robot 3 GDL Jugador de Gato</title>
  <style>
    @page {
      size: landscape letter;
      margin: 8mm;
    }
    body {
      margin: 0;
      padding: 10px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .no-print-bar {
      background: #1e293b;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .btn-print {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-print:hover {
      background: #0369a1;
    }
    @media print {
      .no-print-bar {
        display: none;
      }
      body {
        padding: 0;
        background: #ffffff;
      }
    }
    .sheet {
      background: #ffffff;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      margin: 0 auto;
      display: block;
      width: 260mm;
      height: 195mm;
      position: relative;
      border: 1px solid #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="no-print-bar">
    <div>
      <strong style="font-size: 16px;">🎯 PLANTILLA FÍSICA A ESCALA 1:1 - VERIFICACIÓN DE POSICIÓN DEL ROBOT MK2</strong>
      <div style="font-size: 12px; color: #94a3b8;">Imprime a escala 100% (sin ajustar ni reducir) en hoja Carta o A4 Horizontal y colócala frente al robot.</div>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR PLANTILLA (Ctrl+P)</button>
  </div>

  <svg class="sheet" viewBox="-130 -10 260 195" xmlns="http://www.w3.org/2000/svg">
    <!-- DEFINICIÓN DE PATRONES DE CUADRÍCULA MILIMÉTRICA -->
    <defs>
      <!-- Sub-cuadrícula de 5 mm -->
      <pattern id="grid5mm" width="5" height="5" patternUnits="userSpaceOnUse">
        <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#e2e8f0" stroke-width="0.2"/>
      </pattern>
      <!-- Cuadrícula principal de 10 mm (1 cm) -->
      <pattern id="grid10mm" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="url(#grid5mm)"/>
        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>
      </pattern>
    </defs>

    <!-- FONDO CON CUADRÍCULA A ESCALA 1:1 (UNIDADES = MILÍMETROS) -->
    <rect x="-130" y="-10" width="260" height="195" fill="url(#grid10mm)" />

    <!-- ENCABEZADO Y DATOS TÉCNICOS -->
    <text x="-125" y="-3" font-size="3.5" font-weight="bold" fill="#0f172a">UNIVERSIDAD POLITÉCNICA DE AGUASCALIENTES - INGENIERÍA EN MECATRÓNICA</text>
    <text x="-125" y="1" font-size="2.6" fill="#475569">Plantilla de Verificación de Posición Cinemática 1:1 | Robot Antropomórfico 3 GDL (MK2) - Tablero Gato 3x3</text>

    <!-- REGLA DE CALIBRACIÓN DE 100 MM (10 CM) -->
    <g transform="translate(20, -7)">
      <rect x="0" y="0" width="100" height="5" fill="#f1f5f9" stroke="#0f172a" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0f172a" stroke-width="0.8"/>
      <line x1="25" y1="0" x2="25" y2="3.5" stroke="#0f172a" stroke-width="0.4"/>
      <line x1="50" y1="0" x2="50" y2="5" stroke="#0f172a" stroke-width="0.6"/>
      <line x1="75" y1="0" x2="75" y2="3.5" stroke="#0f172a" stroke-width="0.4"/>
      <line x1="100" y1="0" x2="100" y2="5" stroke="#0f172a" stroke-width="0.8"/>
      <text x="50" y="3.5" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#0f172a">REGLA DE VERIFICACIÓN FÍSICA: 100 mm (10.0 cm)</text>
      <text x="50" y="7.5" font-size="1.8" fill="#64748b" text-anchor="middle">Compruebe con una regla real. Debe medir exactamente 10 cm para validar escala 1:1.</text>
    </g>

    <!-- SISTEMA DE COORDENADAS: ORIGEN DEL ROBOT (0, 0) -->
    <!--
      El robot se coloca en Y_svg = 180 (Base del papel), X_svg = 0.
      Hacia el frente del robot: X_robot aumenta hacia arriba en el papel: Y_svg = 180 - X_robot_mm.
      Lateral del robot: Y_robot = X_svg (derecha = positivo, izquierda = negativo).
    -->
    <g transform="translate(0, 180)">
      <!-- Círculo base robot -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="2,1"/>
      <circle cx="0" cy="0" r="2.5" fill="#0284c7"/>
      <!-- Ejes coordenados de la base -->
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#0284c7" stroke-width="0.6"/>
      <line x1="0" y1="10" x2="0" y2="-40" stroke="#0284c7" stroke-width="0.6" marker-end="url(#arrow)"/>
      <text x="0" y="6" font-size="3" font-weight="bold" text-anchor="middle" fill="#0369a1">ORIGEN BASE ROBOT (X=0, Y=0)</text>
      <text x="0" y="9.5" font-size="2" text-anchor="middle" fill="#64748b">Colocar centro del eje J1 aquí</text>

      <!-- Offset de Hombro a1 = 110 mm -->
      <line x1="-20" y1="-110" x2="20" y2="-110" stroke="#f59e0b" stroke-width="0.4" stroke-dasharray="2,2"/>
      <circle cx="0" cy="-110" r="2" fill="#f59e0b"/>
      <text x="24" y="-109" font-size="2.2" font-weight="bold" fill="#b45309">Eje de Hombro (a1 = 11.0 cm)</text>
    </g>

    <!-- ARCOS DE DISTANCIA RADIAL DESDE LA BASE DEL ROBOT -->
    <path d="M -80 180 A 180 180 0 0 1 80 180" fill="none" stroke="#94a3b8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="75" y="5" font-size="2.2" fill="#94a3b8">R = 18.0 cm</text>

    <!-- ============================================================== -->
    <!-- TABLERO DE GATO 3X3 CENTRADO FRENTE AL ROBOT                    -->
    <!-- Centro del tablero: X_robot = 260 mm (Y_svg = 180 - 260 = -80) -->
    <!-- Espaciado entre casillas: 45 mm (4.5 cm)                       -->
    <!-- Casillas:                                                      -->
    <!-- Fila 1 (Superior/Lejana): X=305 mm -> Y_svg = 180 - 305 = -125 -->
    <!-- Fila 2 (Centro):          X=260 mm -> Y_svg = 180 - 260 = -80  -->
    <!-- Fila 3 (Inferior/Cercana):X=215 mm -> Y_svg = 180 - 215 = -35  -->
    <!-- Columnas: Y_robot = -45, 0, +45 mm -> X_svg = -45, 0, +45     -->
    <!-- ============================================================== -->

    <!-- CONTORNO GENERAL DEL TABLERO (140 x 140 mm) -->
    <rect x="-70" y="-150" width="140" height="140" rx="3" fill="#ffffff" fill-opacity="0.85" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="-67.5" y="-147.5" width="135" height="135" fill="none" stroke="#64748b" stroke-width="0.5"/>

    <!-- LÍNEAS DIVISORIAS DEL TABLERO DE GATO (#) -->
    <!-- Horizontales -->
    <line x1="-67.5" y1="-102.5" x2="67.5" y2="-102.5" stroke="#0f172a" stroke-width="1.0"/>
    <line x1="-67.5" y1="-57.5"  x2="67.5" y2="-57.5"  stroke="#0f172a" stroke-width="1.0"/>
    <!-- Verticales -->
    <line x1="-22.5" y1="-147.5" x2="-22.5" y2="-12.5" stroke="#0f172a" stroke-width="1.0"/>
    <line x1="22.5"  y1="-147.5" x2="22.5"  y2="-12.5" stroke="#0f172a" stroke-width="1.0"/>

    <!-- TÍTULO DEL TABLERO -->
    <text x="0" y="-152" font-size="3.2" font-weight="bold" text-anchor="middle" fill="#0f172a">TABLERO 3x3 DEL GATO (TRES EN RAYA)</text>
    <text x="0" y="-8" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#475569">▲ FRENTE DEL ROBOT (HACIA EL TABLERO) ▲</text>

    <!-- ============================================================== -->
    <!-- MACRO DE CASILLA CON DIANA Y COORDENADAS                       -->
    <!-- ============================================================== -->

    <!-- CASILLA 1: X_robot=30.5 cm, Y_robot=-4.5 cm (X_svg=-45, Y_svg=-125) -->
    <g transform="translate(-45, -125)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#ef4444"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#0284c7" stroke-width="0.4"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#0284c7" stroke-width="0.4"/>
      <text x="0" y="-12" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#0284c7">CASILLA 1</text>
      <text x="0" y="8" font-size="2.0" text-anchor="middle" fill="#475569">X: 30.5 | Y: -4.5 cm</text>
      <text x="0" y="11" font-size="1.9" font-weight="bold" text-anchor="middle" fill="#0369a1">q1:-8.4° q2:52.0° q3:-142.8°</text>
    </g>

    <!-- CASILLA 2: X_robot=30.5 cm, Y_robot=0.0 cm (X_svg=0, Y_svg=-125) -->
    <g transform="translate(0, -125)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#ef4444"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#0284c7" stroke-width="0.4"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#0284c7" stroke-width="0.4"/>
      <text x="0" y="-12" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#0284c7">CASILLA 2</text>
      <text x="0" y="8" font-size="2.0" text-anchor="middle" fill="#475569">X: 30.5 | Y: 0.0 cm</text>
      <text x="0" y="11" font-size="1.9" font-weight="bold" text-anchor="middle" fill="#0369a1">q1: 0.0° q2:52.0° q3:-143.3°</text>
    </g>

    <!-- CASILLA 3: X_robot=30.5 cm, Y_robot=+4.5 cm (X_svg=+45, Y_svg=-125) -->
    <g transform="translate(45, -125)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#ef4444"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#0284c7" stroke-width="0.4"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#0284c7" stroke-width="0.4"/>
      <text x="0" y="-12" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#0284c7">CASILLA 3</text>
      <text x="0" y="8" font-size="2.0" text-anchor="middle" fill="#475569">X: 30.5 | Y: +4.5 cm</text>
      <text x="0" y="11" font-size="1.9" font-weight="bold" text-anchor="middle" fill="#0369a1">q1:+8.4° q2:52.0° q3:-142.8°</text>
    </g>

    <!-- CASILLA 4: X_robot=26.0 cm, Y_robot=-4.5 cm (X_svg=-45, Y_svg=-80) -->
    <g transform="translate(-45, -80)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#ef4444"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#0284c7" stroke-width="0.4"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#0284c7" stroke-width="0.4"/>
      <text x="0" y="-12" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#0284c7">CASILLA 4</text>
      <text x="0" y="8" font-size="2.0" text-anchor="middle" fill="#475569">X: 26.0 | Y: -4.5 cm</text>
      <text x="0" y="11" font-size="1.9" font-weight="bold" text-anchor="middle" fill="#0369a1">q1:-9.8° q2:50.7° q3:-150.3°</text>
    </g>

    <!-- CASILLA 5: X_robot=26.0 cm, Y_robot=0.0 cm (X_svg=0, Y_svg=-80) [CENTRO] -->
    <g transform="translate(0, -80)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#22c55e" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#16a34a" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="1" fill="#ef4444"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#16a34a" stroke-width="0.5"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#16a34a" stroke-width="0.5"/>
      <text x="0" y="-12" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#16a34a">CASILLA 5 (CENTRO)</text>
      <text x="0" y="8" font-size="2.0" text-anchor="middle" fill="#475569">X: 26.0 | Y: 0.0 cm</text>
      <text x="0" y="11" font-size="1.9" font-weight="bold" text-anchor="middle" fill="#15803d">q1: 0.0° q2:50.5° q3:-150.9°</text>
    </g>

    <!-- CASILLA 6: X_robot=26.0 cm, Y_robot=+4.5 cm (X_svg=+45, Y_svg=-80) -->
    <g transform="translate(45, -80)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#ef4444"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#0284c7" stroke-width="0.4"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#0284c7" stroke-width="0.4"/>
      <text x="0" y="-12" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#0284c7">CASILLA 6</text>
      <text x="0" y="8" font-size="2.0" text-anchor="middle" fill="#475569">X: 26.0 | Y: +4.5 cm</text>
      <text x="0" y="11" font-size="1.9" font-weight="bold" text-anchor="middle" fill="#0369a1">q1:+9.8° q2:50.7° q3:-150.3°</text>
    </g>

    <!-- CASILLA 7: X_robot=21.5 cm, Y_robot=-4.5 cm (X_svg=-45, Y_svg=-35) -->
    <g transform="translate(-45, -35)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#ef4444"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#0284c7" stroke-width="0.4"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#0284c7" stroke-width="0.4"/>
      <text x="0" y="-12" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#0284c7">CASILLA 7</text>
      <text x="0" y="8" font-size="2.0" text-anchor="middle" fill="#475569">X: 21.5 | Y: -4.5 cm</text>
      <text x="0" y="11" font-size="1.9" font-weight="bold" text-anchor="middle" fill="#0369a1">q1:-11.8° q2:46.1° q3:-157.2°</text>
    </g>

    <!-- CASILLA 8: X_robot=21.5 cm, Y_robot=0.0 cm (X_svg=0, Y_svg=-35) -->
    <g transform="translate(0, -35)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#ef4444"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#0284c7" stroke-width="0.4"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#0284c7" stroke-width="0.4"/>
      <text x="0" y="-12" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#0284c7">CASILLA 8</text>
      <text x="0" y="8" font-size="2.0" text-anchor="middle" fill="#475569">X: 21.5 | Y: 0.0 cm</text>
      <text x="0" y="11" font-size="1.9" font-weight="bold" text-anchor="middle" fill="#0369a1">q1: 0.0° q2:45.3° q3:-157.9°</text>
    </g>

    <!-- CASILLA 9: X_robot=21.5 cm, Y_robot=+4.5 cm (X_svg=+45, Y_svg=-35) -->
    <g transform="translate(45, -35)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#ef4444"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#0284c7" stroke-width="0.4"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#0284c7" stroke-width="0.4"/>
      <text x="0" y="-12" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#0284c7">CASILLA 9</text>
      <text x="0" y="8" font-size="2.0" text-anchor="middle" fill="#475569">X: 21.5 | Y: +4.5 cm</text>
      <text x="0" y="11" font-size="1.9" font-weight="bold" text-anchor="middle" fill="#0369a1">q1:+11.8° q2:46.1° q3:-157.2°</text>
    </g>

    <!-- ============================================================== -->
    <!-- DISPENSADORES LATERALES DE FICHAS                              -->
    <!-- ============================================================== -->
    <!-- Dispensador Robot 'O': X_robot=18.0 cm, Y_robot=-14.0 cm (X_svg=-140, Y_svg=0) -->
    <g transform="translate(-105, 0)">
      <circle cx="0" cy="0" r="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.5" fill="#ef4444"/>
      <text x="0" y="-16" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#0369a1">DISPENSADOR 'O' (ROBOT)</text>
      <text x="0" y="18" font-size="2.0" text-anchor="middle" fill="#475569">X: 18.0 | Y: -14.0 cm</text>
      <text x="0" y="21" font-size="1.8" font-weight="bold" text-anchor="middle" fill="#0284c7">q1:-37.9° q2:60.4° q3:-158.2°</text>
    </g>

    <!-- Dispensador Humano 'X': X_robot=18.0 cm, Y_robot=+14.0 cm (X_svg=+140, Y_svg=0) -->
    <g transform="translate(105, 0)">
      <circle cx="0" cy="0" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.5" fill="#ef4444"/>
      <text x="0" y="-16" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#991b1b">DISPENSADOR 'X' (HUMANO)</text>
      <text x="0" y="18" font-size="2.0" text-anchor="middle" fill="#475569">X: 18.0 | Y: +14.0 cm</text>
    </g>

    <!-- INSTRUCCIONES DE USO EN PIE DE PÁGINA -->
    <rect x="-125" y="150" width="250" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
    <text x="-120" y="156" font-size="2.4" font-weight="bold" fill="#0f172a">INSTRUCCIONES DE ALINEACIÓN Y CALIBRACIÓN:</text>
    <text x="-120" y="161" font-size="2.0" fill="#334155">1. Coloque la plantilla sobre la mesa de trabajo asegurando que la marca 'ORIGEN BASE ROBOT' coincida con el eje vertical central de J1.</text>
    <text x="-120" y="165" font-size="2.0" fill="#334155">2. En la interfaz gráfica del robot, presione el botón de la casilla que desee comprobar (ej: 'Casilla 5' para el centro o 'Casilla 1' al extremo).</text>
    <text x="-120" y="169" font-size="2.0" fill="#334155">3. En modo 'Tablero (Z=3cm)', la punta del efector o electroimán debe descender exactamente en el punto rojo central de la diana (±3 mm de tolerancia).</text>
  </svg>

</body>
</html>
